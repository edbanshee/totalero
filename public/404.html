<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Totalero</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If deployed under /totalero, redirect smoothly to root of totalero
      var basePath = l.pathname.indexOf('/totalero') === 0 ? '/totalero/' : '/';
      window.location.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath
      );
    </script>
  </head>
  <body>
  </body>
</html>
